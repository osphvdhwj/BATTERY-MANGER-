name: Build Micro-Debug APK

# Trigger the build on pushes to the main branch or manually via the Actions tab
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile Micro-Debug APK
      # This triggers the optimized, R8-minified debug build we configured
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatteryWellbeing-DynamicIsland-Edition
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
